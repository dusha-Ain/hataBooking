server:
  port: 8082
logging:
  level:
    org.springframework.jdbc.core: DEBUG
    org.springframework.jdbc.core.StatementCreatorUtils: TRACE
    com.rent.hata: DEBUG

spring:
  application:
    name: booking
  datasource:
    url: jdbc:postgresql://localhost:5435/hata
    username: booking
    password: booking
    driver-class-name: org.postgresql.Driver
  liquibase:
    change-log: classpath:liquibase/changelog-master.yml

default:
  page:
    size: 5
    number: 1